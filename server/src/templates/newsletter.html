<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amazon Clone Newsletter</title>
  <style>
    body { margin: 0; padding: 0; background-color: #f6f6f6; font-family: 'Segoe UI', Arial, sans-serif; }
    .container { max-width: 600px; margin: 20px auto; background-color: #ffffff; border: 1px solid #ddd; border-radius: 4px; overflow: hidden; }
    .header { background-color: #131921; padding: 20px; text-align: center; }
    .header h1 { margin: 0; color: #ffffff; font-size: 26px; }
    .header h1 span { color: #ff9900; }
    .content { padding: 30px; color: #333333; line-height: 1.6; }
    .button { display: inline-block; background-color: #ffd814; border: 1px solid #fcd200; border-radius: 8px; color: #0f1111; font-weight: bold; padding: 12px 28px; text-decoration: none; margin-top: 15px; }
    .footer { background-color: #f3f3f3; padding: 20px; text-align: center; font-size: 12px; color: #777777; border-top: 1px solid #e7e7e7; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>amazon<span>clone</span></h1>
    </div>
    <div class="content">
      <h2>{{headline}}</h2>
      <p>Hi {{name}},</p>
      <p>{{messageBody}}</p>
      <div style="text-align: center;">
        <a href="{{ctaUrl}}" class="button">{{ctaText}}</a>
      </div>
    </div>
    <div class="footer">
      <p>&copy; 2025 Amazon Clone Inc. All rights reserved.</p>
      <p><a href="{{unsubscribeUrl}}" style="color: #007185;">Unsubscribe from newsletter emails</a></p>
    </div>
  </div>
</body>
</html>
